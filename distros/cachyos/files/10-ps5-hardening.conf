# SSH is key-only by default. Use /usr/local/sbin/ps5-ssh-setup locally to
# install an authorized key; it reloads sshd after validation.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
LoginGraceTime 30
MaxAuthTries 3
MaxStartups 3:30:10
X11Forwarding no
