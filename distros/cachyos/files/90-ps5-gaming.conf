# Keep kernel/driver chatter out of the interactive TTY while retaining it in
# the journal for diagnosis.
kernel.printk = 3 4 1 3

# Prefer fast compressed RAM over killing a game when unified CPU/GPU memory
# gets tight. Avoid clustered swap-in, which is counterproductive for zram.
vm.swappiness = 100
vm.page-cluster = 0

# Bound dirty data so the external mechanical boot disk cannot accumulate
# multi-gigabyte writeback bursts that stall frame delivery.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
